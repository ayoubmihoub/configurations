server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/smart-recruit
    username: postgres
    password: "***"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/smart-recruit
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka
